<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fight Tracker - Nova Luta</title>

    <link rel="stylesheet" href="../css/home.css">
    <link rel="stylesheet" href="../css/dashboard.css">
</head>

<body>
    <div class="box-pai">

        <div class="sidebar">

            <div class="logo-container">

                <img src="../assets/imgs/logo-street-tracker-removebg-preview.png" alt="Logo do Site" class="logo-sidebar">
            
            </div>

            <a href="nova-luta.html" class="btn-nova-luta">+ NOVA LUTA</a>

            <div class="menu-navegacao">
                <ul>
                    <li><a href="dashboard-personagem.html">Personagens</a></li>
                    <li><a href="dashboard-jogadores.html">Jogadores</a></li>
                </ul>
            </div>

            <a href="../index.html" class="btn-sair">SAIR</a>

        </div>


        <div class="main-content">

            <div class="dashboard-header">
                <h1>PAINEL DE RIVALIDADE :: REGISTRAR COMBATE</h1>
            </div>

            <div class="alerta_erro">
                <div class="card_erro" id="cardErro">
                    <span id="mensagem_erro"></span>
                </div>
            </div>


            <div class="container-nova-luta">
                <div class="card-cadastro">
                    <h2>Nova Luta</h2>

                    <div class="formulario">

                        <div class="campo">
                            <span>Resultado do Combate:</span>
                            <select id="select_resultado">
                                <option value="" disabled selected>-- Selecione --</option>
                                <option value="Vitoria">VITÓRIA (YOU WIN)</option>
                                <option value="Derrota">DERROTA (YOU LOSE)</option>
                            </select>
                        </div>

                        <div class="campo">
                            <span>Jogador Adversário (Rival):</span>
                            <input id="input_adversario" type="text" placeholder="Ex: Pedro, Bruno...">
                        </div>

                        <div class="campo">
                            <span>Seu Personagem (Player 1):</span>
                            <select id="select_meu_personagem">
                                <option value="" disabled selected>-- Escolha seu Lutador --</option>
                                <option value="1">Ryu</option>
                                <option value="2">Ken</option>
                                <option value="3">Chun-Li</option>
                                <option value="4">Guile</option>
                                <option value="5">Blanka</option>
                                <option value="6">E. Honda</option>
                                <option value="7">Zangief</option>
                                <option value="8">Dhalsim</option>
                                <option value="9">Balrog</option>
                                <option value="10">Vega</option>
                                <option value="11">Sagat</option>
                                <option value="12">M. Bison</option>
                            </select>
                        </div>

                        <div class="campo">
                            <span>Personagem Adversário (Player 2):</span>
                            <select id="select_personagem_adversario">
                                <option value="" disabled selected>-- Lutador do Rival --</option>
                                <option value="1">Ryu</option>
                                <option value="2">Ken</option>
                                <option value="3">Chun-Li</option>
                                <option value="4">Guile</option>
                                <option value="5">Blanka</option>
                                <option value="6">E. Honda</option>
                                <option value="7">Zangief</option>
                                <option value="8">Dhalsim</option>
                                <option value="9">Balrog</option>
                                <option value="10">Vega</option>
                                <option value="11">Sagat</option>
                                <option value="12">M. Bison</option>
                            </select>
                        </div>

                        <div class="campo">
                            <span>Data da Partida:</span>
                            <input id="input_data_luta" type="date">
                        </div>

                        <button class="botao" onclick="registrarLuta()">Registrar</button>

                        <div id="div_aguardar" class="loading-div">
                            <img src="../assets/circle-loading.gif" id="loading-gif">
                        </div>

                        <div id="div_erros_login"></div>
                    </div>
                </div>
            </div>

        </div>
    </div>
</body>

<script>
    function registrarLuta() {

        var idUsuario = sessionStorage.ID_USUARIO;

        var resultado = document.getElementById("select_resultado").value;
        var rival = document.getElementById("input_adversario").value;
        var personagem1 = document.getElementById("select_meu_personagem").value;
        var personagem2 = document.getElementById("select_personagem_adversario").value;
        var dataPartida = document.getElementById("input_data_luta").value;

        if (resultado == "" || rival == "" || personagem1 == "" || personagem2 == "" || dataPartida == "") {
            alert("Por favor, preencha todos os campos da luta!");
            return false; 
        }


        fetch("/nova-luta/cadastrar", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                resultadoServer: resultado,
                rivalServer: rival,
                personagem1Server: personagem1,
                personagem2Server: personagem2,
                dataServer: dataPartida,
                idUsuarioServer: idUsuario
            })
        }).then(function (resposta) {
            if (resposta.ok) {
                alert("Combate registado com sucesso!");

                document.getElementById("select_resultado").value = "";
                document.getElementById("input_adversario").value = "";
                document.getElementById("select_meu_personagem").value = "";
                document.getElementById("select_personagem_adversario").value = "";
                document.getElementById("input_data_luta").value = "";
            } else {
                console.log("Houve um erro ao tentar registar a luta!");
            }
        }).catch(function (erro) {
            console.log("Erro: ", erro);
        });
    }
</script>

</html>
