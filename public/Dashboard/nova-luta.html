<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fight Tracker - Nova Luta</title>

    <link rel="stylesheet" href="../css/home.css">
    <link rel="stylesheet" href="../css/dashboard.css">
</head>

<body>
    <div class="box-pai">

        <div class="sidebar">
            <a href="nova-luta.html" class="btn-nova-luta">+ NOVA LUTA</a>

            <div class="menu-navegacao">
                <ul>
                    <li><a href="dashboard-personagem.html">Personagens</a></li>
                    <li><a href="dashboard-jogadores.html">Jogadores</a></li>
                </ul>
            </div>
        </div>


        <div class="main-content">

            <div class="dashboard-header">
                <h1>PAINEL DE RIVALIDADE :: REGISTRAR COMBATE</h1>
            </div>

            <div class="alerta_erro">
                <div class="card_erro" id="cardErro">
                    <span id="mensagem_erro"></span>
                </div>
            </div>


            <div class="container-nova-luta">
                <div class="card-cadastro">
                    <h2>Nova Luta</h2>

                    <div class="formulario">

                        <div class="campo">
                            <span>Resultado do Combate:</span>
                            <select id="select_resultado">
                                <option value="" disabled selected>-- Selecione --</option>
                                <option value="Vitoria">VITÓRIA (YOU WIN)</option>
                                <option value="Derrota">DERROTA (YOU LOSE)</option>
                            </select>
                        </div>

                        <div class="campo">
                            <span>Jogador Adversário (Rival):</span>
                            <input id="input_adversario" type="text" placeholder="Ex: Pedro, Bruno...">
                        </div>

                        <div class="campo">
                            <span>Seu Personagem (Player 1):</span>
                            <select id="select_meu_personagem">
                                <option value="" disabled selected>-- Escolha seu Lutador --</option>
                                <option value="Ryu">Ryu</option>
                                <option value="Ken">Ken</option>
                                <option value="Chun-Li">Chun-Li</option>
                                <option value="Guile">Guile</option>
                                <option value="Blanka">Blanka</option>
                                <option value="E. Honda">E. Honda</option>
                                <option value="Zangief">Zangief</option>
                                <option value="Dhalsim">Dhalsim</option>
                                <option value="Balrog">Balrog</option>
                                <option value="Vega">Vega</option>
                                <option value="Sagat">Sagat</option>
                                <option value="M. Bison">M. Bison</option>
                            </select>
                        </div>

                        <div class="campo">
                            <span>Personagem Adversário (Player 2):</span>
                            <select id="select_personagem_adversario">
                                <option value="" disabled selected>-- Lutador do Rival --</option>
                                <option value="Ryu">Ryu</option>
                                <option value="Ken">Ken</option>
                                <option value="Chun-Li">Chun-Li</option>
                                <option value="Guile">Guile</option>
                                <option value="Blanka">Blanka</option>
                                <option value="E. Honda">E. Honda</option>
                                <option value="Zangief">Zangief</option>
                                <option value="Dhalsim">Dhalsim</option>
                                <option value="Balrog">Balrog</option>
                                <option value="Vega">Vega</option>
                                <option value="Sagat">Sagat</option>
                                <option value="M. Bison">M. Bison</option>
                            </select>
                        </div>

                        <div class="campo">
                            <span>Data da Partida:</span>
                            <input id="input_data_luta" type="date">
                        </div>

                        <button class="botao" onclick="registrarLuta()">Registrar</button>

                        <div id="div_aguardar" class="loading-div">
                            <img src="../assets/circle-loading.gif" id="loading-gif">
                        </div>

                        <div id="div_erros_login"></div>
                    </div>
                </div>
            </div>

        </div>
    </div>
</body>

</html>
