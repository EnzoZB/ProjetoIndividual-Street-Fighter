<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>StreetTracker | Cadastro</title>

    <link rel="stylesheet" href="css/login_cadastro.css">
    <link rel="preconnect" href="https://fonts.gstatic.com" />
</head>

<body>
    <div class="header">
        <div class="container">
            <a href="index.html" class="titulo">
                <img src="assets/imgs/logo-street-tracker-removebg-preview.png" class="logo-img" alt="StreetTracker">
            </a>
            <ul class="navbar">
                <li>
                    <a href="index.html">Inicial</a>
                </li>
                <li>
                    <a href="index.html#universo">O Jogo</a>
                </li>
                <li>
                    <a href="index.html#lutadores">Lutadores</a>
                </li>
                <li>
                    <a href="index.html#historia">História</a>
                </li>
                <li class="separador"></li>
                <li>
                    <a href="login.html">Login</a>
                </li>
                <li class="agora">
                    <a href="cadastro.html">Cadastro</a>
                </li>
            </ul>
        </div>
    </div>

    <div class="cadastro">

        <div class="alerta_erro">
            <div class="card_erro" id="cardErro">
                <span id="mensagem_erro"></span>
            </div>

        </div>
        <div class="container">
            <div class="card card-cadastro">
                <h2>Bem-vindo (a) !</h2>
                <div class="formulario">

                    <div class="campo">
                        <span>Nome:</span>
                        <input id="nome_input" type="text" placeholder="Seu nome" />
                    </div>

                    <div class="campo">
                        <span>Nickname:</span>
                        <input id="nickname_input" type="text" placeholder="Insira aqui seu nickname" />
                    </div>

                    <div class="campo">
                        <span>E-mail:</span>
                        <input id="email_input" type="text" placeholder="meuemail@provedor.com" />
                    </div>
                    <div class="campo">
                        <span>Senha:</span>
                        <input id="senha_input" type="password" placeholder="******" />
                    </div>

                    <div class="campo">
                        <span>Confirmação da Senha:</span>
                        <input id="confirmacao_senha_input" type="password" placeholder="******" />
                    </div>

                    <button class="botao" onclick="cadastrar()">Cadastrar</button>
                </div>
                <div id="div_aguardar" class="loading-div">
                    <img src="./assets/circle-loading.svg" id="loading-gif" />
                </div>

                <div id="div_erros_login"></div>
            </div>
        </div>
    </div>
    <script>
        function aguardar() {
            div_aguardar.style.display = "flex";
        }

        function finalizarAguardar(texto) {
            div_aguardar.style.display = "none";

            if (texto) {
                cardErro.style.display = "block";
                mensagem_erro.innerHTML = texto;
            }
        }

        function limparFormulario() {
            nome_input.value = "";
            nickname_input.value = "";
            email_input.value = "";
            senha_input.value = "";
            confirmacao_senha_input.value = "";
        }

       function cadastrar() {
    aguardar();

    var nomeVar = nome_input.value;
    var nicknameVar = nickname_input.value;
    var emailVar = email_input.value;
    var senhaVar = senha_input.value;
    var confirmacaoSenhaVar = confirmacao_senha_input.value;

    if (
        nomeVar == "" ||
        nicknameVar == "" ||
        emailVar == "" ||
        senhaVar == "" ||
        confirmacaoSenhaVar == ""
    ) {
        finalizarAguardar("Preencha todos os campos para continuar!");
        setTimeout(sumirMensagem, 5000);
        return false;
    }
    else if (!emailVar.includes("@") || !emailVar.includes(".")) {
        finalizarAguardar("Insira um e-mail válido (ex: nome@provedor.com).");
        setTimeout(sumirMensagem, 5000);
        return false;
    }
    
    var temMaiuscula = false;
    var temMinuscula = false;
    var temNumero = false;
    var temEspecial = false;
    var caracteresEspeciais = "!@#$%^&*()_+-=[]{};':\"\\|,.<>/?";

    for (var i = 0; i < senhaVar.length; i++) {
        var caractere = senhaVar[i];

        if (caractere >= "A" && caractere <= "Z") {
            temMaiuscula = true;
        } else if (caractere >= "a" && caractere <= "z") {
            temMinuscula = true;
        } else if (caractere >= "0" && caractere <= "9") {
            temNumero = true;
        } else if (caracteresEspeciais.includes(caractere)) {
            temEspecial = true;
        }
    }

    if (
        senhaVar.length <= 8 ||
        !temMaiuscula ||
        !temMinuscula ||
        !temNumero ||
        !temEspecial ||
        senhaVar.includes(" ")
    ) {
        finalizarAguardar(
            "Senha inválida! Ela deve conter:<br>" +
            "• Mais de 8 caracteres<br>" +
            "• Pelo menos 1 letra maiúscula<br>" +
            "• Pelo menos 1 letra minúscula<br>" +
            "• Pelo menos 1 número<br>" +
            "• Pelo menos 1 caractere especial (ex: @, #, !)<br>" +
            "• Nenhum espaço"
        );
        
        return false;
    }

    if (senhaVar != confirmacaoSenhaVar) {
        finalizarAguardar("As senhas não coincidem!");
        setTimeout(sumirMensagem, 5000);
        return false;
    }

    fetch("/usuarios/cadastrar", {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
        },
        body: JSON.stringify({
            nomeServer: nomeVar,
            nicknameServer: nicknameVar,
            emailServer: emailVar,
            senhaServer: senhaVar,
        }),
    })
        .then(function (resposta) {
            console.log("resposta: ", resposta);

            if (resposta.ok) {
                cardErro.style.display = "block";
                mensagem_erro.innerHTML =
                    "Cadastro realizado com sucesso! Redirecionando para tela de Login...";

                setTimeout(() => {
                    window.location = "login.html";
                }, 2000);

                limparFormulario();
                finalizarAguardar();
            } else {
                throw "Houve um erro ao tentar realizar o cadastro!";
            }
        })
        .catch(function (resposta) {
            console.log(`#ERRO: ${resposta}`);
            finalizarAguardar(resposta);
            setTimeout(sumirMensagem, 5000);
        });

    return false;
}
        function sumirMensagem() {
            cardErro.style.display = "none";
        }
    </script>
</body>

</html>
